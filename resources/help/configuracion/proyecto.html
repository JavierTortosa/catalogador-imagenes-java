<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ayuda - Configuración: Proyecto</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <h1>Proyecto</h1>
    <p>Carpeta base de los proyectos y archivo temporal de selección.</p>

    <table class="help-table">
        <tr><th>Parámetro</th><th>Descripción</th></tr>
        <tr>
            <td><strong>Carpeta base</strong></td>
            <td>Carpeta donde se guardan y buscan los proyectos (<code>.prj</code>).</td>
        </tr>
        <tr>
            <td><strong>Archivo temporal</strong></td>
            <td>Nombre del archivo de trabajo temporal que mantiene la "Selección Actual" (por defecto <code>seleccion_actual.prj</code>).</td>
        </tr>
    </table>

</body>
</html>
